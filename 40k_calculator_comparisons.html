<!DOCTYPE html><html lang="en"><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>40K Saved Result Comparisons</title><style>
:root{--bg:#0c0c0e;--surface:#121216;--panel:#18181e;--panel2:#1e1e26;--border:#2a2a36;--brass:#c49a2a;--red:#b83228;--red2:#e04030;--green:#2ecc71;--text:#d8d2ca;--dim:#6a6560;--accent:#f0d070}*{box-sizing:border-box}body{margin:0;background:var(--bg);color:var(--text);font-family:Arial,sans-serif}.app{max-width:1150px;margin:auto;padding:28px 16px}h1{color:var(--accent);letter-spacing:.08em;margin:0 0 6px}.sub{color:var(--dim);margin-bottom:20px}.toolbar,.panel{background:var(--panel);border:1px solid var(--border);border-radius:5px;padding:14px;margin-bottom:14px}.toolbar{display:flex;gap:8px;flex-wrap:wrap;align-items:center}button,select{background:var(--surface);border:1px solid var(--border);color:var(--text);padding:9px 12px;border-radius:3px;font-weight:700;cursor:pointer}button:hover{border-color:var(--brass);color:var(--accent)}button.danger{border-color:var(--red);color:var(--red2)}.group{margin:20px 0}.group h2{font-size:15px;color:var(--brass);border-bottom:1px solid var(--border);padding-bottom:8px}.card{background:var(--panel);border:1px solid var(--border);border-radius:4px;padding:13px;margin:8px 0}.card-head{display:grid;grid-template-columns:auto 1fr auto;gap:12px;align-items:start}.name{font-weight:800;color:var(--accent);font-size:17px}.match{color:var(--text);margin-top:4px}.meta{color:var(--dim);font-size:13px;margin-top:5px}.kills{text-align:right;color:var(--red2);font-size:24px;font-weight:800}.kills small{display:block;color:var(--dim);font-size:10px;text-transform:uppercase}.actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:10px}.details{display:none;border-top:1px solid var(--border);margin-top:12px;padding-top:12px}.details.open{display:block}.grid{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}.box{background:var(--surface);border:1px solid var(--border);padding:9px;border-radius:3px}.lbl{color:var(--dim);font-size:10px;text-transform:uppercase}.val{font-weight:700;margin-top:3px;overflow-wrap:anywhere}.profile{padding:7px 0;border-bottom:1px solid var(--border)}.compare-row{display:grid;grid-template-columns:40px 1.5fr 1fr 1fr 1fr;gap:8px;padding:9px;border-bottom:1px solid var(--border);align-items:center}.compare-row.head{color:var(--dim);font-size:11px;text-transform:uppercase}.empty{text-align:center;color:var(--dim);padding:35px}@media(max-width:700px){.grid{grid-template-columns:1fr}.card-head{grid-template-columns:auto 1fr}.kills{grid-column:2}.compare-row{grid-template-columns:32px 1fr}.compare-row span:nth-child(n+3){display:none}}
</style></head><body><div class="app"><h1>Saved Results & Comparisons</h1><div class="sub">Select specific results for a quick comparison, then expand any result for full details.</div><div class="toolbar"><button onclick="compareSelected()">Compare Selected</button><button onclick="clearSelection()">Clear Selection</button><button class="danger" onclick="deleteSelected()">Delete Selected</button><select id="groupFilter" onchange="render()"><option value="">All attacker vs defender groups</option></select><button onclick="exportResults()">Export Backup</button><button onclick="document.getElementById('importFile').click()">Import Backup</button><input id="importFile" type="file" accept=".json,application/json" style="display:none" onchange="importResults(event)"><button onclick="location.reload()">Refresh</button><button onclick="window.close()">Return to Calculator</button></div><div class="panel" id="comparePanel" style="display:none"></div><div id="results"></div></div><script>
const KEY='wh40kCalculatorSavedResultsV1',EDIT='wh40kCalculatorEditResultV1';
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
function rows(){try{return JSON.parse(localStorage.getItem(KEY)||'[]')}catch(e){return []}}function save(x){localStorage.setItem(KEY,JSON.stringify(x))}function selected(){return [...document.querySelectorAll('.pick:checked')].map(x=>x.value)}
function filters(){const gs=[...new Set(rows().map(x=>x.comparisonGroup))].sort(),s=document.getElementById('groupFilter'),v=s.value;s.innerHTML='<option value="">All attacker vs defender groups</option>'+gs.map(g=>'<option>'+esc(g)+'</option>').join('');s.value=v}
function detail(r){return `<div class="details" id="d-${r.id}"><div class="grid"><div class="box"><div class="lbl">Detachments</div><div class="val">${esc((r.detachments||[]).join(' · ')||'None')}</div></div><div class="box"><div class="lbl">Shooting Stratagem</div><div class="val">${esc(r.shootingStratagem||'None')}</div></div><div class="box"><div class="lbl">Fight Stratagem</div><div class="val">${esc(r.fightStratagem||'None')}</div></div><div class="box"><div class="lbl">Shooting Models Killed</div><div class="val">${(+r.phaseBreakdown?.shooting||0).toFixed(2)}</div></div><div class="box"><div class="lbl">Fight Models Killed</div><div class="val">${((+r.phaseBreakdown?.fight1||0)+(+r.phaseBreakdown?.fight2||0)).toFixed(2)}</div></div><div class="box"><div class="lbl">Notes</div><div class="val">${esc(r.notes||'None')}</div></div></div><h3>Units and weapon profiles used</h3>${(r.profiles||[]).map(p=>`<div class="profile"><b>${esc(p.name)}</b> · ${esc(p.phase)} · ${(+p.modelsKilled||0).toFixed(2)} models killed · ${(+p.damage||0).toFixed(2)} damage<br><span class="meta">${esc(p.rules||'')}</span></div>`).join('')||'<div class="meta">No profile details saved.</div>'}</div>`}
function render(){filters();const rs=rows(),f=document.getElementById('groupFilter').value,show=f?rs.filter(x=>x.comparisonGroup===f):rs,out=document.getElementById('results');if(!show.length){out.innerHTML='<div class="panel empty">No saved results found.</div>';return}const groups={};show.forEach(r=>(groups[r.comparisonGroup]??=[]).push(r));out.innerHTML=Object.entries(groups).map(([g,list])=>`<section class="group"><h2>${esc(g)}</h2>${list.sort((a,b)=>b.modelsKilled-a.modelsKilled).map(r=>`<div class="card"><div class="card-head"><input class="pick" type="checkbox" value="${r.id}"><div><div class="name">${esc(r.name)}</div><div class="match"><b>Attacker:</b> ${esc(r.attacker)} &nbsp; <b>Defender:</b> ${esc(r.defender)}</div><div class="meta">${esc(r.mode)} · Updated ${new Date(r.updatedAt).toLocaleString()}</div></div><div class="kills">${(+r.modelsKilled||0).toFixed(2)}<small>Models killed</small></div></div><div class="actions"><button onclick="toggle('${r.id}')">View Details</button><button onclick="edit('${r.id}')">Edit in Calculator</button><button class="danger" onclick="delOne('${r.id}')">Delete</button></div>${detail(r)}</div>`).join('')}</section>`).join('')}
function toggle(id){document.getElementById('d-'+id).classList.toggle('open')}function clearSelection(){document.querySelectorAll('.pick').forEach(x=>x.checked=false);document.getElementById('comparePanel').style.display='none'}
function compareSelected(){const ids=selected(),rs=rows().filter(x=>ids.includes(x.id)).sort((a,b)=>b.modelsKilled-a.modelsKilled),p=document.getElementById('comparePanel');if(ids.length<2){alert('Select at least two results to compare.');return}p.style.display='block';p.innerHTML='<h2>Quick Comparison</h2><div class="compare-row head"><span>Rank</span><span>Result</span><span>Attacker</span><span>Defender</span><span>Models Killed</span></div>'+rs.map((r,i)=>`<div class="compare-row"><span>${i+1}</span><span><b>${esc(r.name)}</b></span><span>${esc(r.attacker)}</span><span>${esc(r.defender)}</span><span><b>${(+r.modelsKilled||0).toFixed(2)}</b></span></div>`).join('');p.scrollIntoView({behavior:'smooth'})}
function delOne(id){const r=rows().find(x=>x.id===id);if(r&&confirm('Delete "'+r.name+'"?')){save(rows().filter(x=>x.id!==id));render()}}function deleteSelected(){const ids=selected();if(!ids.length)return alert('Select results to delete.');if(confirm('Delete '+ids.length+' selected result(s)?')){save(rows().filter(x=>!ids.includes(x.id)));document.getElementById('comparePanel').style.display='none';render()}}
function edit(id){const r=rows().find(x=>x.id===id);if(!r)return;localStorage.setItem(EDIT,JSON.stringify(r));const w=window.open('40k_calculator.html','_blank');if(!w)alert('Allow pop-ups, then try again.')}
function exportResults(){const data=rows();if(!data.length)return alert('There are no saved results to export.');const backup={format:'wh40k-calculator-results',version:1,exportedAt:new Date().toISOString(),resultCount:data.length,results:data},blob=new Blob([JSON.stringify(backup,null,2)],{type:'application/json'}),url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='40k_calculator_backup_'+new Date().toISOString().replace(/[:.]/g,'-')+'.json';document.body.appendChild(a);a.click();a.remove();URL.revokeObjectURL(url)}
function validImportedResult(r){return r&&typeof r==='object'&&typeof r.name==='string'&&r.name.trim()&&typeof r.attacker==='string'&&typeof r.defender==='string'}
function importResults(event){const file=event.target.files&&event.target.files[0];event.target.value='';if(!file)return;const reader=new FileReader();reader.onload=()=>{try{const parsed=JSON.parse(reader.result),incoming=Array.isArray(parsed)?parsed:parsed.results;if(!Array.isArray(incoming))throw new Error('The selected file does not contain a results array.');const clean=incoming.filter(validImportedResult);if(!clean.length)throw new Error('No valid saved results were found.');const current=rows(),byName=new Map(current.map(r=>[r.name.toLowerCase(),r]));let added=0,replaced=0,skipped=0;for(const r of clean){const key=r.name.toLowerCase(),existing=byName.get(key);if(existing){if(!confirm('A result named "'+existing.name+'" already exists.\n\nOK: overwrite\nCancel: skip')){skipped++;continue}const i=current.findIndex(x=>x.name.toLowerCase()===key);current[i]={...r,id:existing.id,createdAt:existing.createdAt||r.createdAt,updatedAt:new Date().toISOString()};byName.set(key,current[i]);replaced++}else{const copy={...r,id:r.id||((globalThis.crypto&&crypto.randomUUID)?crypto.randomUUID():String(Date.now()+Math.random()))};current.push(copy);byName.set(key,copy);added++}}save(current);render();alert('Import complete.\n\nAdded: '+added+'\nOverwritten: '+replaced+'\nSkipped: '+skipped)}catch(err){alert('The backup could not be imported.\n\n'+err.message)}};reader.onerror=()=>alert('The selected backup file could not be read.');reader.readAsText(file)}

render();</script></body></html>
